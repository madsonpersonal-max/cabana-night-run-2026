<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabana Night Run 2026 | ADM</title>
<style>
:root{--bg:#101114;--panel:#191b20;--panel2:#20232a;--line:#343741;--text:#f5f5f6;--muted:#a9adb8;--terra:#c66a4b;--terra2:#e28b68;--green:#b9e63c;--red:#ff7777;--blue:#83b8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#292c34;color:var(--text)}button:hover{filter:brightness(1.12)}button.primary{background:var(--terra);border-color:var(--terra);color:#fff;font-weight:700}button.danger{border-color:#824646;color:#ffb4b4}button.small{padding:5px 8px;font-size:12px}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{padding:22px 14px;border-right:1px solid var(--line);background:#141519}.brand{padding:5px 10px 24px}.brand b{display:block;font-size:18px}.brand span{color:var(--muted);font-size:12px}.nav{display:grid;gap:7px}.nav button{text-align:left;background:transparent;border-color:transparent;color:#c8cad1}.nav button.active{background:#34251f;border-color:#684331;color:#fff}.sidefoot{position:sticky;top:calc(100vh - 90px);margin:28px 8px 0;color:var(--muted);font-size:11px}.main{min-width:0}.top{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}.top small{color:var(--muted)}.wrap{padding:24px;max-width:1500px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}.pagehead h1{margin:0 0 4px;font-size:25px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;min-width:0}.metric .label{font-size:12px;color:var(--muted)}.metric .num{font-size:28px;font-weight:750;margin:7px 0 2px}.metric .hint{font-size:12px;color:var(--muted)}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 12px}.twocol{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:650px;background:var(--panel)}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#202229}tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;background:#343741;color:#ddd}.pill.ok{background:#263923;color:#c9f5a6}.pill.warn{background:#493821;color:#ffd49c}.pill.bad{background:#492a2a;color:#ffb3b3}.actions{display:flex;gap:6px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#111216;color:var(--text);padding:10px}textarea{min-height:75px;resize:vertical}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar input{max-width:300px}.notice{border:1px solid #66513a;background:#2a2119;color:#f5d5a7;padding:12px;border-radius:10px;font-size:12px}.progress{height:8px;background:#343741;border-radius:99px;overflow:hidden;margin-top:9px}.progress span{display:block;height:100%;background:var(--green)}.hidden{display:none!important}.empty{padding:22px;text-align:center;color:var(--muted)}.footnote{font-size:11px;color:var(--muted);margin-top:12px}.modalback{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.modalhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}.modalhead h2{margin:0;font-size:19px}.toast{position:fixed;right:20px;bottom:20px;background:#252932;border:1px solid #4b505d;border-radius:10px;padding:12px 16px;z-index:20;max-width:360px}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.subnav button.active{border-color:var(--terra);background:#34251f}.kpirow{display:flex;gap:10px;flex-wrap:wrap}.kpirow .card{flex:1;min-width:140px}.auditlist{display:grid;gap:8px}.audititem{padding:10px;border-radius:8px;background:var(--panel2);font-size:12px}.audititem small{display:block;color:var(--muted);margin-top:3px}
@media(max-width:950px){.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);padding:12px}.brand{padding:5px 8px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidefoot{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol{grid-template-columns:1fr}.top{padding:14px 18px}.wrap{padding:18px}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:12px}.metric .num{font-size:23px}.wrap{padding:12px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.pagehead{display:block}.pagehead button{margin-top:12px}}
</style></head>
<body>
<div class="shell">
<aside class="side">
 <div class="brand"><b> CABANA <span style="color:var(--terra2)">NIGHT RUN</span></b><span>PAINEL ADMINISTRATIVO · 2026</span></div>
 <nav class="nav" id="nav">
  <button class="active" data-page="dashboard">▦ Dashboard</button>
  <button data-page="patrocinios">◇ Patrocínios</button>
  <button data-page="empresas">▤ Empresas</button>
  <button data-page="vagas">▥ Central de Vagas</button>
  <button data-page="auditoria">◷ Auditoria</button>
 </nav>
 <div class="sidefoot">Protótipo administrativo V1.1<br>Uso de homologação</div>
</aside>
<main class="main">
 <header class="top"><div><b id="topTitle">Dashboard</b><br><small>Controle administrativo Cabana Night Run 2026</small></div><div class="actions"><span class="pill warn">HOMOLOGAÇÃO</span><button id="exportBtn">Exportar dados</button></div></header>
 <div class="wrap" id="app"></div>
</main></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(function(){
'use strict';
const KEY='cabana_night_run_adm_v1';
const initial=()=>({version:1,config:{raceCapacity:1000,kidsCapacity:100,kidsReleased:50,pcdLimit:10},sponsors:[],companies:[],audit:[],meta:{createdAt:new Date().toISOString()}});
let db=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&x.version===1?x:initial()}catch(e){return initial()}}
function save(action,detail){db.audit.unshift({id:uid(),at:new Date().toISOString(),action,detail});db.audit=db.audit.slice(0,500);try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){db.audit.shift();toast('Não foi possível salvar: armazenamento local cheio. Reduza o tamanho do anexo ou exporte um backup.');return false}}
function uid(){return 'CNR-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function num(n){return Math.max(0,Number(n)||0)}
function activeCompanySlots(mod){return db.companies.filter(c=>c.modality===mod&&c.status!=='CANCELADA').reduce((a,c)=>a+num(c.quantity),0)}
function usedCompanySlots(mod){return db.companies.filter(c=>c.modality===mod&&c.status!=='CANCELADA').reduce((a,c)=>a+num(c.used),0)}
function reservedCompanySlots(mod){return Math.max(0,activeCompanySlots(mod)-usedCompanySlots(mod))}
function remaining(mod){const cfg=db.config;if(mod==='race')return Math.max(0,cfg.raceCapacity-num(cfg.siteUsed)-num(cfg.receptionUsed)-num(cfg.bonusRace)-usedCompanySlots('race')-reservedCompanySlots('race'));return Math.max(0,cfg.kidsReleased-num(cfg.kidsUsed)-num(cfg.bonusKids)-usedCompanySlots('kids')-reservedCompanySlots('kids'))}
function raceOccupied(){return num(db.config.siteUsed)+num(db.config.receptionUsed)+num(db.config.bonusRace)+activeCompanySlots('race')}
function kidsOccupied(){return num(db.config.kidsUsed)+num(db.config.bonusKids)+activeCompanySlots('kids')}
function toast(t){const r=document.getElementById('toastRoot');r.innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>r.innerHTML='',3000)}
const pages={dashboard:'Dashboard',patrocinios:'Patrocínios',empresas:'Empresas',vagas:'Central de Vagas',auditoria:'Auditoria'};
let page='dashboard';
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;render()});
document.getElementById('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cabana-night-run-adm-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup JSON exportado.')});
function render(){document.getElementById('topTitle').textContent=pages[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const app=document.getElementById('app');if(page==='dashboard')app.innerHTML=dashboard();else if(page==='patrocinios')app.innerHTML=sponsorsPage();else if(page==='empresas')app.innerHTML=companiesPage();else if(page==='vagas')app.innerHTML=vagasPage();else app.innerHTML=auditPage();bindPage()}
function metric(label,value,hint){return `<div class="card metric"><div class="label">${label}</div><div class="num">${value}</div><div class="hint">${hint||''}</div></div>`}
function dashboard(){let sp=db.sponsors.reduce((a,s)=>a+num(s.value),0),co=db.companies.reduce((a,c)=>a+num(c.total),0),bms=db.companies.flatMap(c=>c.bms||[]),bmPaid=bms.filter(b=>b.status==='PAGO').reduce((a,b)=>a+num(b.value),0),bmPending=bms.filter(b=>b.status!=='PAGO').reduce((a,b)=>a+num(b.value),0);return `<div class="pagehead"><div><h1>Visão geral</h1><div class="muted">Resumo de capacidade, patrocínios e lotes empresariais.</div></div><button class="primary" data-action="new-company">+ Registrar compra de vagas</button></div>
<div class="grid">${metric('Vagas corrida 7 km',db.config.raceCapacity,`${raceOccupied()} ocupadas ou reservadas`)}${metric('Saldo corrida',remaining('race'),'Inclui reservas empresariais e bonificações registradas')}${metric('Corridinha liberada',db.config.kidsReleased,`de ${db.config.kidsCapacity} vagas totais`)}${metric('Saldo corridinha',remaining('kids'),'Calculado sobre vagas liberadas')}${metric('Patrocínios cadastrados',db.sponsors.length,money(sp)+' em valores registrados')}${metric('Empresas / lotes',db.companies.length,money(co)+' em compras registradas')}${metric('Vagas PCD',`${db.config.pcdUsed||0}/${db.config.pcdLimit}`,'Controle auxiliar dentro das 1.000 vagas da corrida')}${metric('Bonificações',num(db.config.bonusRace)+num(db.config.bonusKids),'Quantidades informadas na Central de Vagas')}${metric('BM recebidos',money(bmPaid),'Soma dos BMs marcados como pagos')}${metric('BM pendentes',money(bmPending),bms.length?'BMs cadastrados ainda não pagos':'Nenhum BM cadastrado')}</div>
<div class="section twocol"><div class="card"><h2>Capacidade e disponibilidade</h2><p class="muted">Corrida 7 km</p><div class="progress"><span style="width:${Math.min(100,raceOccupied()/Math.max(1,db.config.raceCapacity)*100)}%"></span></div><p><b>${raceOccupied()}</b> ocupadas/reservadas · <b>${remaining('race')}</b> disponíveis</p><p class="muted">Corridinha Infantil</p><div class="progress"><span style="width:${Math.min(100,kidsOccupied()/Math.max(1,db.config.kidsReleased)*100)}%"></span></div><p><b>${kidsOccupied()}</b> ocupadas/reservadas · <b>${remaining('kids')}</b> disponíveis</p><div class="notice">PCD não é uma categoria adicional de estoque: as até 10 vagas gratuitas fazem parte das 1.000 vagas da corrida.</div></div><div class="card"><h2>Atividade recente</h2>${db.audit.length?`<div class="auditlist">${db.audit.slice(0,5).map(a=>`<div class="audititem"><b>${esc(a.action)}</b> — ${esc(a.detail)}<small>${new Date(a.at).toLocaleString('pt-BR')}</small></div>`).join('')}</div>`:'<div class="empty">Nenhuma atividade registrada ainda.</div>'}</div></div><div class="footnote">Indicadores são calculados com os dados registrados neste protótipo. Não representa conexão com inscrições públicas nem confirmação bancária.</div>`}
function sponsorsPage(){return `<div class="pagehead"><div><h1>Patrocínios</h1><div class="muted">Cadastro e acompanhamento de patrocinadores, contrapartidas e valores.</div></div><button class="primary" data-action="new-sponsor">+ Novo patrocínio</button></div><div class="toolbar"><input id="sponsorSearch" placeholder="Buscar por patrocinador, CNPJ ou cota…"></div><div id="sponsorTable">${sponsorTable('')}</div>`}
function sponsorTable(q){let rows=db.sponsors.filter(s=>(s.name+' '+(s.cnpj||'')+' '+(s.tier||'')).toLowerCase().includes(q.toLowerCase()));return rows.length?`<div class="tablewrap"><table><thead><tr><th>Patrocinador</th><th>Cota / contrapartida</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${esc(s.name)}</b><br><small>${esc(s.cnpj||'CNPJ não informado')}</small></td><td>${esc(s.tier)}<br><small>${esc(s.benefits||'')}</small></td><td>${money(s.value)}<br><small>${esc(s.paymentMethod||'Não informado')} · ${esc(s.installments||1)} parcela(s)/BM(s)</small></td><td><span class="pill ${s.status==='CONFIRMADO'?'ok':'warn'}">${esc(s.status)}</span></td><td><div class="actions"><button class="small" data-action="edit-sponsor" data-id="${s.id}">Editar</button><button class="small" data-action="sponsor-receipt" data-id="${s.id}">Recibo</button><button class="small danger" data-action="delete-sponsor" data-id="${s.id}">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">Nenhum patrocínio cadastrado.</div>'}
function companiesPage(){return `<div class="pagehead"><div><h1>Empresas</h1><div class="muted">Controle de compra/reserva de lotes. A lista de atletas é um documento anexado ao cadastro, não cria inscrições individuais.</div></div><button class="primary" data-action="new-company">+ Nova compra / reserva</button></div><div class="toolbar"><input id="companySearch" placeholder="Buscar empresa, CNPJ ou recibo…"></div><div id="companyTable">${companyTable('')}</div><div class="footnote">O recibo gerado neste protótipo é um registro administrativo, não documento fiscal nem confirmação bancária.</div>`}
function companyTable(q){let rows=db.companies.filter(c=>(c.name+' '+(c.cnpj||'')+' '+c.receipt).toLowerCase().includes(q.toLowerCase()));return rows.length?`<div class="tablewrap"><table><thead><tr><th>Empresa / recibo</th><th>Modalidade</th><th>Vagas</th><th>Valores</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.map(c=>`<tr><td><b>${esc(c.name)}</b><br><small>${esc(c.cnpj||'CNPJ não informado')}</small><br><small>${esc(c.receipt)}</small></td><td>${c.modality==='race'?'Corrida 7 km':'Corridinha Infantil'}</td><td>${c.quantity} reservadas/contratadas · ${c.used} utilizadas<br><small>${c.quantity-c.used} ainda não utilizadas</small></td><td>${money(c.unit)} / vaga<br><b>${money(c.total)}</b><br><small>${esc(c.paymentMethod||'')} · ${esc(c.installments||1)} parcela(s)/BM(s)</small></td><td><span class="pill ${c.status==='PAGO'?'ok':c.status==='CANCELADA'?'bad':'warn'}">${esc(c.status)}</span></td><td><div class="actions"><button class="small" data-action="edit-company" data-id="${c.id}">Editar</button><button class="small" data-action="receipt" data-id="${c.id}">Recibo</button>${c.athleteListData?`<button class="small" data-action="download-list" data-id="${c.id}">Baixar lista</button>`:'' }<button class="small" data-action="bms" data-id="${c.id}">BMs</button><button class="small danger" data-action="delete-company" data-id="${c.id}">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">Nenhuma empresa cadastrada.</div>'}
function vagasPage(){let c=db.config;return `<div class="pagehead"><div><h1>Central de Vagas</h1><div class="muted">Configuração da capacidade e controle de ocupação por origem.</div></div><button class="primary" data-action="save-vagas">Salvar capacidade</button></div><div class="notice">Regra fixa: corrida com 1.000 vagas totais, incluindo até 10 PCD gratuitas. Não criar estoque adicional para PCD. Corridinha tem 100 vagas totais, com ${c.kidsReleased} inicialmente liberadas.</div><div class="section card"><h2>Capacidade e ocupação</h2><div class="formgrid"><div class="field"><label>Total de vagas — corrida 7 km</label><input type="number" id="raceCapacity" min="1" value="${c.raceCapacity}"></div><div class="field"><label>Total de vagas — corridinha infantil</label><input type="number" id="kidsCapacity" min="1" value="${c.kidsCapacity}"></div><div class="field"><label>Vagas da corridinha liberadas</label><input type="number" id="kidsReleased" min="0" value="${c.kidsReleased}"></div><div class="field"><label>Limite auxiliar PCD (dentro da corrida)</label><input type="number" id="pcdLimit" min="0" max="10" value="${c.pcdLimit}"></div><div class="field"><label>Corrida — vagas online/público já ocupadas</label><input type="number" id="siteUsed" min="0" value="${c.siteUsed||0}"></div><div class="field"><label>Corrida — vagas presenciais já ocupadas</label><input type="number" id="receptionUsed" min="0" value="${c.receptionUsed||0}"></div><div class="field"><label>Corrida — bonificações confirmadas</label><input type="number" id="bonusRace" min="0" value="${c.bonusRace||0}"></div><div class="field"><label>Corridinha — inscrições ocupadas</label><input type="number" id="kidsUsed" min="0" value="${c.kidsUsed||0}"></div><div class="field"><label>Corridinha — bonificações confirmadas</label><input type="number" id="bonusKids" min="0" value="${c.bonusKids||0}"></div><div class="field"><label>PCD já utilizadas (controle auxiliar)</label><input type="number" id="pcdUsed" min="0" value="${c.pcdUsed||0}"></div></div><div class="footnote">Os números de online, presencial e bonificações são campos de conciliação manual nesta versão. Não existe sincronização automática com o sistema de inscrições.</div></div><div class="section grid">${metric('Corrida ocupadas/reservadas',raceOccupied(),`de ${c.raceCapacity}`)}${metric('Corrida disponíveis',remaining('race'),'Após empresas e demais origens')}${metric('Corridinha ocupadas/reservadas',kidsOccupied(),`de ${c.kidsReleased} liberadas`)}${metric('Corridinha disponíveis',remaining('kids'),'Após empresas e demais origens')}</div><div class="section card"><h2>Resumo por lote empresarial</h2><p>Corrida: ${usedCompanySlots('race')} vagas utilizadas de ${activeCompanySlots('race')} contratadas/reservadas.</p><p>Corridinha: ${usedCompanySlots('kids')} vagas utilizadas de ${activeCompanySlots('kids')} contratadas/reservadas.</p></div>`}
function auditPage(){return `<div class="pagehead"><div><h1>Auditoria</h1><div class="muted">Registro das ações realizadas neste navegador.</div></div><button data-action="export-audit">Exportar auditoria</button></div>${db.audit.length?`<div class="auditlist">${db.audit.map(a=>`<div class="audititem"><b>${esc(a.action)}</b> — ${esc(a.detail)}<small>${new Date(a.at).toLocaleString('pt-BR')} · ${esc(a.id)}</small></div>`).join('')}</div>`:'<div class="card empty">Nenhuma ação registrada.</div>'}<div class="footnote">Auditoria local não é imutável nem compartilhada; produção exige backend com autenticação e registro no servidor.</div>`}
function bindPage(){const ss=document.getElementById('sponsorSearch');if(ss)ss.addEventListener('input',()=>document.getElementById('sponsorTable').innerHTML=sponsorTable(ss.value));const cs=document.getElementById('companySearch');if(cs)cs.addEventListener('input',()=>document.getElementById('companyTable').innerHTML=companyTable(cs.value));}
document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action,id=b.dataset.id;if(act==='new-sponsor')sponsorModal();if(act==='edit-sponsor')sponsorModal(id);if(act==='sponsor-receipt')sponsorReceipt(id);if(act==='delete-sponsor')deleteItem('sponsor',id);if(act==='new-company')companyModal();if(act==='edit-company')companyModal(id);if(act==='delete-company')deleteItem('company',id);if(act==='receipt')receipt(id);if(act==='download-list')downloadList(id);if(act==='bms')bmsModal(id);if(act==='save-vagas')saveVagas();if(act==='export-audit')exportAudit()});
function modal(title,body,submitLabel,submitFn){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><h2>${title}</h2><button data-close>Fechar</button></div>${body}<div class="actions" style="margin-top:16px"><button data-close>Cancelar</button><button class="primary" id="modalSubmit">${submitLabel}</button></div></div></div>`;root.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>root.innerHTML='');root.querySelector('.modalback').addEventListener('click',e=>{if(e.target.classList.contains('modalback'))root.innerHTML=''});document.getElementById('modalSubmit').onclick=()=>{if(submitFn()!==false)root.innerHTML=''}}
function paymentOptions(selected){const opts=['PIX','TRANSFERÊNCIA BANCÁRIA','BOLETO BANCÁRIO','CARTÃO DE CRÉDITO','BM — Boletim de Medição Mensal','OUTRO'];return opts.map(x=>`<option ${selected===x?'selected':''}>${x}</option>`).join('')}
function sponsorModal(id){let s=db.sponsors.find(x=>x.id===id)||{name:'',cnpj:'',tier:'',value:'',status:'EM NEGOCIAÇÃO',benefits:'',notes:'',paymentMethod:'BM — Boletim de Medição Mensal',installments:1,firstDue:'',contractRef:''};modal(id?'Editar patrocínio':'Novo patrocínio',`<div class="formgrid"><div class="field"><label>Nome do patrocinador *</label><input id="fName" value="${esc(s.name)}" required></div><div class="field"><label>CNPJ</label><input id="fCnpj" value="${esc(s.cnpj)}" placeholder="00.000.000/0000-00"></div><div class="field"><label>Cota / categoria *</label><input id="fTier" value="${esc(s.tier)}" placeholder="Master, Ouro, Prata…"></div><div class="field"><label>Valor negociado (R$) *</label><input id="fValue" type="number" min="0" step=".01" value="${esc(s.value)}"></div><div class="field"><label>Forma de pagamento</label><select id="fPay">${paymentOptions(s.paymentMethod)}</select></div><div class="field"><label>Quantidade de parcelas / BMs</label><input id="fInstallments" type="number" min="1" value="${esc(s.installments||1)}"></div><div class="field"><label>Primeiro vencimento</label><input id="fDue" type="date" value="${esc(s.firstDue||'')}"></div><div class="field"><label>Contrato / referência</label><input id="fContract" value="${esc(s.contractRef||'')}"></div><div class="field"><label>Status</label><select id="fStatus">${['EM NEGOCIAÇÃO','PROPOSTA ENVIADA','CONFIRMADO','CANCELADO'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Contrapartidas</label><input id="fBenefits" value="${esc(s.benefits)}" placeholder="Logo, backdrop, camiseta…"></div><div class="field full"><label>Observações</label><textarea id="fNotes">${esc(s.notes)}</textarea></div></div>`,id?'Salvar alterações':'Cadastrar patrocínio',()=>{let name=v('fName').trim(),tier=v('fTier').trim(),value=Number(v('fValue'));if(!name||!tier||!Number.isFinite(value)||value<0){toast('Preencha nome, cota e valor válido.');return false}const item={...s,name,cnpj:v('fCnpj').trim(),tier,value,status:v('fStatus'),benefits:v('fBenefits').trim(),notes:v('fNotes').trim(),paymentMethod:v('fPay'),installments:Math.max(1,Number(v('fInstallments'))||1),firstDue:v('fDue'),contractRef:v('fContract').trim(),updatedAt:new Date().toISOString()};if(id){db.sponsors=db.sponsors.map(x=>x.id===id?item:x);save('Patrocínio atualizado',name)}else{item.id=uid();item.createdAt=new Date().toISOString();db.sponsors.push(item);save('Patrocínio cadastrado',name)}render();toast('Patrocínio salvo.');})}
function companyModal(id){let c=db.companies.find(x=>x.id===id)||{name:'',cnpj:'',modality:'race',quantity:1,used:0,unit:100,status:'AGUARDANDO PAGAMENTO',paymentMethod:'PIX',paymentDate:'',notes:'',athleteListName:'',athleteListData:'',installments:1,firstDue:'',contractRef:'',bms:[]};modal(id?'Editar lote empresarial':'Registrar compra/reserva de vagas',`<div class="formgrid"><div class="field"><label>Empresa *</label><input id="fName" value="${esc(c.name)}"></div><div class="field"><label>CNPJ</label><input id="fCnpj" value="${esc(c.cnpj)}"></div><div class="field"><label>Modalidade *</label><select id="fMod"><option value="race" ${c.modality==='race'?'selected':''}>Corrida 7 km</option><option value="kids" ${c.modality==='kids'?'selected':''}>Corridinha Infantil</option></select></div><div class="field"><label>Quantidade de vagas *</label><input id="fQty" type="number" min="1" value="${c.quantity}"></div><div class="field"><label>Vagas já utilizadas</label><input id="fUsed" type="number" min="0" value="${c.used}"></div><div class="field"><label>Valor por vaga (R$) *</label><input id="fUnit" type="number" min="0" step=".01" value="${c.unit}"></div><div class="field"><label>Status do pagamento</label><select id="fStatus">${['AGUARDANDO PAGAMENTO','PAGO','PARCIAL','CANCELADA'].map(x=>`<option ${c.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Forma de pagamento</label><select id="fPay">${paymentOptions(c.paymentMethod)}</select></div><div class="field"><label>Quantidade de parcelas / BMs</label><input id="fInstallments" type="number" min="1" value="${c.installments||1}"></div><div class="field"><label>Primeiro vencimento</label><input id="fDue" type="date" value="${esc(c.firstDue||'')}"></div><div class="field"><label>Contrato / referência</label><input id="fContract" value="${esc(c.contractRef||'')}"></div><div class="field"><label>Data do pagamento</label><input id="fDate" type="date" value="${esc(c.paymentDate)}"></div><div class="field full"><label>Anexar lista de atletas (Excel, CSV, ODS ou PDF)</label><input id="fListFile" type="file" accept=".xlsx,.xls,.csv,.ods,.pdf"><small class="muted">Arquivo salvo junto ao cadastro neste navegador (limite de 2 MB).</small><div class="muted" id="currentListName">${esc(c.athleteListName||'Nenhum arquivo anexado')}</div></div><div class="field full"><label>Observações / negociação</label><textarea id="fNotes">${esc(c.notes)}</textarea></div></div><div class="notice" style="margin-top:12px">O arquivo selecionado fica anexado ao registro neste navegador. Os nomes não são convertidos automaticamente em inscrições individuais.</div>`,id?'Salvar alterações':'Registrar lote',async()=>{let name=v('fName').trim(),mod=v('fMod'),qty=Number(v('fQty')),used=Number(v('fUsed')),unit=Number(v('fUnit'));if(!name||!Number.isInteger(qty)||qty<1||!Number.isInteger(used)||used<0||used>qty||!Number.isFinite(unit)||unit<0){toast('Confira empresa, quantidade, vagas utilizadas e valor por vaga.');return false}const limit=mod==='race'?db.config.raceCapacity:db.config.kidsReleased;const existing=db.companies.filter(x=>x.id!==id&&x.modality===mod&&x.status!=='CANCELADA');const committed=existing.reduce((a,x)=>a+num(x.quantity),0)+num(mod==='race'?db.config.siteUsed:db.config.kidsUsed)+num(mod==='race'?db.config.receptionUsed:0)+num(mod==='race'?db.config.bonusRace:db.config.bonusKids);if(committed+qty>limit){toast(`Não há capacidade suficiente. Limite considerado: ${limit} vagas.`);return false}let listName=c.athleteListName||'',listData=c.athleteListData||'';const fileInput=document.getElementById('fListFile');const file=fileInput&&fileInput.files&&fileInput.files[0];if(file){if(file.size>2*1024*1024){toast('O arquivo deve ter no máximo 2 MB nesta versão local.');return false}listName=file.name;listData=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||''));reader.onerror=reject;reader.readAsDataURL(file)})}const item={...c,name,cnpj:v('fCnpj').trim(),modality:mod,quantity:qty,used,unit,total:qty*unit,status:v('fStatus'),paymentMethod:v('fPay'),paymentDate:v('fDate'),installments:Math.max(1,Number(v('fInstallments'))||1),firstDue:v('fDue'),contractRef:v('fContract').trim(),bms:c.bms||[],athleteListName:listName,athleteListData:listData,notes:v('fNotes').trim(),updatedAt:new Date().toISOString()};if(id){db.companies=db.companies.map(x=>x.id===id?item:x);save('Lote empresarial atualizado',name)}else{item.id=uid();item.receipt='REC-'+new Date().getFullYear()+'-'+String(db.companies.length+1).padStart(4,'0');item.createdAt=new Date().toISOString();db.companies.push(item);save('Lote empresarial registrado',`${name} · ${qty} vagas · ${item.receipt}`)}render();toast('Lote empresarial salvo.');})}
function v(id){return document.getElementById(id)?.value??''}
function saveVagas(){let c={raceCapacity:Number(v('raceCapacity')),kidsCapacity:Number(v('kidsCapacity')),kidsReleased:Number(v('kidsReleased')),pcdLimit:Number(v('pcdLimit')),siteUsed:Number(v('siteUsed')),receptionUsed:Number(v('receptionUsed')),bonusRace:Number(v('bonusRace')),kidsUsed:Number(v('kidsUsed')),bonusKids:Number(v('bonusKids')),pcdUsed:Number(v('pcdUsed'))};if(Object.values(c).some(x=>!Number.isInteger(x)||x<0)||c.raceCapacity<1||c.kidsCapacity<1||c.kidsReleased>c.kidsCapacity||c.pcdLimit>10||c.pcdUsed>c.pcdLimit){toast('Confira os números. PCD tem limite máximo de 10 e a liberação infantil não pode superar o total.');return}if(c.raceCapacity!==1000){toast('Regra do evento: corrida total deve permanecer em 1.000 vagas.');return}if(c.kidsCapacity!==100){toast('Regra do evento: corridinha total deve permanecer em 100 vagas.');return}if(c.siteUsed+c.receptionUsed+c.bonusRace+activeCompanySlots('race')>c.raceCapacity||c.kidsUsed+c.bonusKids+activeCompanySlots('kids')>c.kidsReleased){toast('A ocupação/reserva ultrapassa a capacidade disponível. Ajuste os números antes de salvar.');return}db.config=c;save('Central de vagas atualizada','Capacidade e ocupação manual');render();toast('Central de vagas salva.')}
function deleteItem(type,id){const arr=type==='sponsor'?db.sponsors:db.companies;const item=arr.find(x=>x.id===id);if(!item)return;if(!confirm(`Confirma excluir ${type==='sponsor'?'o patrocínio':'o lote empresarial'} de "${item.name}"? A ação ficará na auditoria.`))return;if(type==='sponsor')db.sponsors=db.sponsors.filter(x=>x.id!==id);else db.companies=db.companies.filter(x=>x.id!==id);save(type==='sponsor'?'Patrocínio excluído':'Lote empresarial excluído',item.name);render();toast('Registro excluído.')}
function downloadList(id){const c=db.companies.find(x=>x.id===id);if(!c||!c.athleteListData){toast('Nenhuma lista anexada.');return}const a=document.createElement('a');a.href=c.athleteListData;a.download=c.athleteListName||'lista-atletas';document.body.appendChild(a);a.click();a.remove();toast('Download da lista iniciado.')}
function bmsModal(id){const c=db.companies.find(x=>x.id===id);if(!c)return;const rows=c.bms||[];modal('Boletins de Medição Mensal',`<div class="notice">Empresa: ${esc(c.name)} · Contrato: ${esc(c.contractRef||'Não informado')}. Um BM só é considerado recebido quando marcado como PAGO.</div><div class="formgrid" style="margin-top:12px"><div class="field"><label>Competência *</label><input id="bmCompetence" type="month"></div><div class="field"><label>Número do BM *</label><input id="bmNumber" placeholder="BM-001"></div><div class="field"><label>Valor medido (R$) *</label><input id="bmValue" type="number" min="0" step=".01"></div><div class="field"><label>Vencimento</label><input id="bmDue" type="date"></div><div class="field"><label>Status</label><select id="bmStatus">${['EM ELABORAÇÃO','ENVIADO','APROVADO','FATURADO','PAGO','CONTESTADO'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Data do recebimento</label><input id="bmPaidDate" type="date"></div><div class="field full"><label>Observações / protocolo</label><textarea id="bmNotes"></textarea></div></div><div class="section"><h3>Histórico de BMs</h3>${rows.length?`<div class="tablewrap"><table><thead><tr><th>BM / competência</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Ação</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${esc(x.number)}<br>${esc(x.competence)}</td><td>${money(x.value)}</td><td>${esc(x.due||'—')}</td><td>${esc(x.status)}</td><td><button class="small danger" data-bm-delete="${i}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum BM cadastrado.</div>'}</div>`, 'Registrar BM',()=>{const competence=v('bmCompetence'),number=v('bmNumber').trim(),value=Number(v('bmValue'));if(!competence||!number||!Number.isFinite(value)||value<=0){toast('Informe competência, número e valor válido do BM.');return false}c.bms=c.bms||[];c.bms.push({id:uid(),competence,number,value,due:v('bmDue'),status:v('bmStatus'),paidDate:v('bmPaidDate'),notes:v('bmNotes').trim(),createdAt:new Date().toISOString()});save('BM registrado',`${c.name} · ${number} · ${money(value)}`);render();toast('BM registrado.');});document.querySelectorAll('[data-bm-delete]').forEach(btn=>btn.onclick=()=>{const i=Number(btn.dataset.bmDelete);if(confirm('Excluir este BM?')){c.bms.splice(i,1);save('BM excluído',`${c.name} · ${i+1}`);bmsModal(id)}})}
function sponsorReceipt(id){const s=db.sponsors.find(x=>x.id===id);if(!s)return;const w=window.open('','_blank');if(!w){toast('Permita pop-ups para abrir o recibo.');return}w.document.write(`<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Recibo de patrocínio</title><style>body{font:16px Arial;max-width:760px;margin:40px auto;color:#222}h1{color:#9c4c34}p{line-height:1.6}.note{border:1px solid #ccc;padding:12px;font-size:12px}</style><h1>CABANA NIGHT RUN 2026</h1><h2>Recibo administrativo de patrocínio / registro comercial</h2><p><b>Patrocinador:</b> ${esc(s.name)}</p><p><b>CNPJ:</b> ${esc(s.cnpj||'Não informado')}</p><p><b>Cota:</b> ${esc(s.tier)}</p><p><b>Valor negociado:</b> ${money(s.value)}</p><p><b>Forma de pagamento:</b> ${esc(s.paymentMethod||'Não informada')}</p><p><b>Parcelas/BMs previstos:</b> ${esc(s.installments||1)}</p><p><b>Primeiro vencimento:</b> ${esc(s.firstDue||'Não informado')}</p><p><b>Contrato/referência:</b> ${esc(s.contractRef||'Não informado')}</p><p><b>Status:</b> ${esc(s.status)}</p><p><b>Contrapartidas:</b> ${esc(s.benefits||'Não informadas')}</p><div class="note">Documento administrativo. Não comprova pagamento recebido e não substitui documento fiscal.</div><p>Emitido em ${new Date().toLocaleString('pt-BR')}</p><button onclick="window.print()">Imprimir / Salvar em PDF</button></html>`);w.document.close();save('Recibo de patrocínio emitido',s.name)}
function receipt(id){const c=db.companies.find(x=>x.id===id);if(!c)return;const w=window.open('','_blank');if(!w){toast('Permita pop-ups para abrir o recibo.');return}w.document.write(`<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Recibo ${esc(c.receipt)}</title><style>body{font:16px Arial;max-width:760px;margin:40px auto;color:#222}h1{color:#9c4c34}hr{margin:25px 0}p{line-height:1.6}.note{border:1px solid #ccc;padding:12px;font-size:12px}</style><h1>CABANA NIGHT RUN 2026</h1><h2>Recibo administrativo de compra/reserva de vagas</h2><hr><p><b>Recibo:</b> ${esc(c.receipt)}</p><p><b>Empresa:</b> ${esc(c.name)}</p><p><b>CNPJ:</b> ${esc(c.cnpj||'Não informado')}</p><p><b>Modalidade:</b> ${c.modality==='race'?'Corrida 7 km':'Corridinha Infantil'}</p><p><b>Quantidade contratada/reservada:</b> ${c.quantity} vagas</p><p><b>Vagas utilizadas:</b> ${c.used} · <b>Não utilizadas:</b> ${c.quantity-c.used}</p><p><b>Valor unitário negociado:</b> ${money(c.unit)}</p><p><b>Valor total:</b> ${money(c.total)}</p><p><b>Status informado:</b> ${esc(c.status)}</p><p><b>Forma de pagamento:</b> ${esc(c.paymentMethod)} · <b>Parcelas/BMs previstos:</b> ${esc(c.installments||1)} · <b>Contrato:</b> ${esc(c.contractRef||'Não informado')}</p><p><b>Data:</b> ${esc(c.paymentDate||'Não informada')}</p><p><b>Lista de atletas:</b> ${esc(c.athleteListName||'Não informada')}</p><hr><div class="note">Documento administrativo gerado pelo protótipo. Não é documento fiscal, comprovante bancário ou confirmação independente de pagamento.</div><p>Emitido em ${new Date().toLocaleString('pt-BR')}</p><button onclick="window.print()">Imprimir / Salvar em PDF</button></html>`);w.document.close();save('Recibo administrativo emitido',`${c.receipt} · ${c.name}`)}
function exportAudit(){const blob=new Blob([JSON.stringify(db.audit,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cabana-night-run-auditoria.json';a.click();URL.revokeObjectURL(a.href);toast('Auditoria exportada.')}
render();
